style:
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true

complexity:
  CyclomaticComplexMethod:
    threshold: 15
  LargeClass:
    threshold: 600
  LongParameterList:
    functionThreshold: 6
    constructorThreshold: 6
  TooManyFunctions:
    thresholdInClasses: 12

performance:
  active: true

comments:
  active: true

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
      - 'androidx.compose.runtime.Composable'

Compose:
  active: true
  ComposeNaming:
    active: true
  ComposeComposableModifier:
    active: true
  ComposeModifierOrder:
    active: true
  ComposeLambdaOffset:
    active: true

