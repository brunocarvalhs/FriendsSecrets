name: Release to Master

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version_manager:
    name: Version Manager
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      new_version_code: ${{ steps.version.outputs.new_version_code }}
      develop_branch: ${{ steps.config.outputs.develop_branch }}
      master_branch: ${{ steps.config.outputs.master_branch }}
      bot_name: ${{ steps.config.outputs.bot_name }}
      bot_email: ${{ steps.config.outputs.bot_email }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load Pipeline Configuration
        id: config
        run: |
          echo "develop_branch=$(yq '.git.branches.develop' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "master_branch=$(yq '.git.branches.main' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "bot_name=$(yq '.git.bot_name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "bot_email=$(yq '.git.bot_email' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

      - name: Checkout correct develop branch
        run: git checkout ${{ steps.config.outputs.develop_branch }}

      - name: Install yq
        run: sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq

      - name: Run versioning script
        id: version
        run: |
          chmod +x .github/scripts/version.sh
          ./.github/scripts/version.sh

      - name: Commit version bump and changelog
        run: |
          git config user.name "${{ steps.config.outputs.bot_name }}"
          git config user.email "${{ steps.config.outputs.bot_email }}"
          git remote set-url origin https://x-access-token:${{ secrets.TOKEN }}@github.com/${{ github.repository }}.git
          
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} and update CHANGELOG"
            git push origin ${{ steps.config.outputs.develop_branch }}
          else
            echo "No changes to commit"
          fi

  pr_release_create:
    name: PR Release Create
    needs: version_manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version_manager.outputs.develop_branch }}

      - name: Set release branch name
        run: echo "RELEASE_BRANCH=release-${{ needs.version_manager.outputs.new_version }}" >> $GITHUB_ENV

      - name: Create release branch and push
        run: |
          git config user.name "${{ needs.version_manager.outputs.bot_name }}"
          git config user.email "${{ needs.version_manager.outputs.bot_email }}"
          git remote set-url origin https://x-access-token:${{ secrets.TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b $RELEASE_BRANCH
          git push origin $RELEASE_BRANCH

      - name: Create Pull Request via GH CLI
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          gh auth login --with-token <<< "$GITHUB_TOKEN"
          gh pr create \
            --title "Release ${{ needs.version_manager.outputs.new_version }}" \
            --body "Automated release PR for version ${{ needs.version_manager.outputs.new_version }}. Check CHANGELOG.md for details." \
            --base ${{ needs.version_manager.outputs.master_branch }} \
            --head $RELEASE_BRANCH
