name: Release to Master

on:
  workflow_dispatch:

jobs:
  version_manager:
    name: Version Manager
    runs-on: ubuntu-latest
    outputs:
      new_name: ${{ steps.bump.outputs.new_name }}
      new_code: ${{ steps.bump.outputs.new_code }}
      updated: ${{ steps.bump.outputs.updated }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: develop

      - name: Count feat commits
        id: count_feat
        run: |
          FEAT=$(git log origin/master..develop --pretty=%s | grep -E '^feat' | wc -l || echo 0)
          FEAT=${FEAT// /}
          FEAT=${FEAT:-0}
          echo "feat=$FEAT" >> $GITHUB_OUTPUT

      - name: Count fix/revert/perf/refactor commits
        id: count_fix
        run: |
          FIX=$(git log origin/master..develop --pretty=%s | grep -E '^(fix|revert|perf|refactor)' | wc -l || echo 0)
          FIX=${FIX// /}
          FIX=${FIX:-0}
          echo "fix=$FIX" >> $GITHUB_OUTPUT

      - name: Count BREAKING CHANGE commits
        id: count_breaking
        run: |
          BREAKING=$(git log origin/master..develop --pretty=%b | grep -c 'BREAKING CHANGE' || true)
          BREAKING=${BREAKING// /}
          BREAKING=${BREAKING:-0}
          echo "breaking=$BREAKING" >> $GITHUB_OUTPUT

      - name: Get current version
        id: version
        run: |
          FILE=app/build.gradle
          VERSION_NAME=$(grep "versionName" $FILE | sed 's/.*"\(.*\)"/\1/')
          VERSION_CODE=$(grep "versionCode" $FILE | awk '{print $3}')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          FEAT=${{ steps.count_feat.outputs.feat }}
          FIX=${{ steps.count_fix.outputs.fix }}
          BREAKING=${{ steps.count_breaking.outputs.breaking }}
          VERSION=${{ steps.version.outputs.name }}
          CODE=${{ steps.version.outputs.code }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ $((FEAT + FIX + BREAKING)) -eq 0 ]; then
            NEW_VERSION="$VERSION"
            NEW_CODE="$CODE"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            if [ $BREAKING -gt 0 ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            else
              MINOR=$((MINOR + FEAT))
              PATCH=$((PATCH + FIX))
            fi
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            NEW_CODE=$((CODE + 1))
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

          echo "new_name=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

  update_version:
    name: Update Version
    needs: version_manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: develop

      - name: Update build.gradle if version updated
        if: ${{ needs.version_manager.outputs.updated == 'true' }}
        run: |
          FILE=app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ needs.version_manager.outputs.new_code }}/" $FILE
          sed -i "s/versionName \".*\"/versionName \"${{ needs.version_manager.outputs.new_name }}\"/" $FILE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILE
          git commit -m "chore: bump version to ${{ needs.version_manager.outputs.new_name }} (${{ needs.version_manager.outputs.new_code }})" || echo "No changes"
          git push origin develop

  pr_release_create:
    name: PR Release Create
    needs: update_version
    if: ${{ needs.version_manager.outputs.updated == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: develop
  
      - name: Create release PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ needs.version_manager.outputs.new_name }}"
          branch: release-$(date +'%Y-%m-%d')
          base: master
          title: "Release ${{ needs.version_manager.outputs.new_name }}"
          body: |
            ${{ needs.version_manager.outputs.new_name }}:
            - Feats: ${{ needs.version_manager.outputs.feat }}
            - Fix/Refactor/Perf/Revert: ${{ needs.version_manager.outputs.fix }}
            - Breaking Changes: ${{ needs.version_manager.outputs.breaking }}
