name: ACTION - Release to Master

on:
  workflow_dispatch:

jobs:
  version_manager:
    name: Version Manager
    runs-on: ubuntu-latest
    outputs:
      new_name: ${{ steps.bump.outputs.new_name }}
      new_code: ${{ steps.bump.outputs.new_code }}
      updated: ${{ steps.bump.outputs.updated }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: develop

      - name: Trazer master
        run: git fetch origin master:master

      - name: Contar commits feat
        id: count_feat
        run: |
          FEAT=$(git log master..develop --pretty=%s | grep -E '^feat' | wc -l || echo 0)
          FEAT=${FEAT// /}
          FEAT=${FEAT:-0}
          echo "feat=$FEAT" >> $GITHUB_OUTPUT

      - name: Contar commits fix/revert/perf/refactor
        id: count_fix
        run: |
          FIX=$(git log master..develop --pretty=%s | grep -E '^(fix|revert|perf|refactor)' | wc -l || echo 0)
          FIX=${FIX// /}
          FIX=${FIX:-0}
          echo "fix=$FIX" >> $GITHUB_OUTPUT

      - name: Contar commits BREAKING CHANGE
        id: count_breaking
        run: |
          BREAKING=$(git log master..develop --pretty=%b | grep -c 'BREAKING CHANGE' || true)
          BREAKING=${BREAKING// /}
          BREAKING=${BREAKING:-0}
          echo "breaking=$BREAKING" >> $GITHUB_OUTPUT

      - name: Obter versão atual
        id: version
        run: |
          FILE=app/build.gradle
          VERSION_NAME=$(grep "versionName" $FILE | sed 's/.*"\(.*\)"/\1/')
          VERSION_CODE=$(grep "versionCode" $FILE | awk '{print $3}')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Calcular nova versão
        id: bump
        run: |
          FEAT=${{ steps.count_feat.outputs.feat }}
          FIX=${{ steps.count_fix.outputs.fix }}
          BREAKING=${{ steps.count_breaking.outputs.breaking }}
          VERSION=${{ steps.version.outputs.name }}
          CODE=${{ steps.version.outputs.code }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
      
          if [ $((FEAT + FIX + BREAKING)) -eq 0 ]; then
            NEW_VERSION="$VERSION"
            NEW_CODE="$CODE"
            UPDATED=false
          else
            if [ $BREAKING -gt 0 ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            else
              MINOR=$((MINOR + FEAT))
              PATCH=$((PATCH + FIX))
            fi
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            NEW_CODE=$((CODE + 1))
            UPDATED=true
          fi

          echo "new_name=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT

  update_version:
    name: Update Version
    needs: version_manager
    runs-on: ubuntu-latest
    if: ${{ needs.version_manager.outputs.updated == 'true' }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: develop

      - name: Atualizar build.gradle
        run: |
          FILE=app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ needs.version_manager.outputs.new_code }}/" $FILE
          sed -i "s/versionName \".*\"/versionName \"${{ needs.version_manager.outputs.new_name }}\"/" $FILE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILE
          git commit -m "chore: bump version to ${{ needs.version_manager.outputs.new_name }} (${{ needs.version_manager.outputs.new_code }})"
          git push origin develop

  pr_release_create:
    name: PR Release Create
    needs: update_version
    runs-on: ubuntu-latest
    if: ${{ needs.version_manager.outputs.updated == 'true' }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: develop

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Criar branch de release
        id: branch
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          BRANCH="release-$TIMESTAMP"
          git checkout -b $BRANCH
          git push origin $BRANCH
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Listar PRs entre master..develop
        id: pr_list
        run: |
          PRS=$(gh pr list --base master --head develop --state merged --json number,title --jq '.[] | "- PR #\(.number) \(.title)"')
          echo "prs<<EOF" >> $GITHUB_ENV
          echo "$PRS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Criar PR de release
        run: |
          BODY="Versão: ${{ needs.version_manager.outputs.new_name }}\n\n$PRS"
          gh pr create --title "Release ${{ steps.branch.outputs.branch_name }}" \
                       --body "$BODY" \
                       --base master \
                       --head ${{ steps.branch.outputs.branch_name }}
