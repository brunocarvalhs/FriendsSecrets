name: Release to Master

on:
  workflow_dispatch:

jobs:
  version_manager:
    name: Version Manager
    runs-on: ubuntu-latest
    outputs:
      new_name: ${{ steps.bump.outputs.new_name }}
      new_code: ${{ steps.bump.outputs.new_code }}
      updated: ${{ steps.bump.outputs.updated }}
      feat: ${{ steps.count_feat.outputs.feat }}
      fix: ${{ steps.count_fix.outputs.fix }}
      breaking: ${{ steps.count_breaking.outputs.breaking }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: develop

      - name: Count feat commits
        id: count_feat
        run: |
          FEAT=$(git log origin/master..develop --pretty=%s | grep -E '^feat' | wc -l || echo 0)
          FEAT=${FEAT// /}
          FEAT=${FEAT:-0}
          echo "feat=$FEAT" >> $GITHUB_OUTPUT

      - name: Count fix/revert/perf/refactor commits
        id: count_fix
        run: |
          FIX=$(git log origin/master..develop --pretty=%s | grep -E '^(fix|revert|perf|refactor)' | wc -l || echo 0)
          FIX=${FIX// /}
          FIX=${FIX:-0}
          echo "fix=$FIX" >> $GITHUB_OUTPUT

      - name: Count BREAKING CHANGE commits
        id: count_breaking
        run: |
          BREAKING=$(git log origin/master..develop --pretty=%b | grep -c 'BREAKING CHANGE' || true)
          BREAKING=${BREAKING// /}
          BREAKING=${BREAKING:-0}
          echo "breaking=$BREAKING" >> $GITHUB_OUTPUT

      - name: Get current version
        id: version
        run: |
          FILE_KTS="app/build.gradle.kts"
          FILE_GRADLE="app/build.gradle"

          if [ -f "$FILE_KTS" ]; then
            FILE="$FILE_KTS"
            VERSION_NAME=$(grep "versionName" "$FILE" | sed 's/.*"\(.*\)"/\1/')
            VERSION_CODE=$(grep "versionCode" "$FILE" | awk '{print $2}' | tr -d '()')
          elif [ -f "$FILE_GRADLE" ]; then
            FILE="$FILE_GRADLE"
            VERSION_NAME=$(grep "versionName" "$FILE" | sed 's/versionName "\(.*\)"/\1/')
            VERSION_CODE=$(grep "versionCode" "$FILE" | awk '{print $2}')
          else
            echo "⚠️ Nenhum build.gradle(.kts) encontrado!"
            VERSION_NAME="0.0.0"
            VERSION_CODE="0"
          fi

          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          FEAT=${{ steps.count_feat.outputs.feat }}
          FIX=${{ steps.count_fix.outputs.fix }}
          BREAKING=${{ steps.count_breaking.outputs.breaking }}
          VERSION=${{ steps.version.outputs.name }}
          CODE=${{ steps.version.outputs.code }}
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ -z "$MAJOR" ]; then MAJOR=0; fi
          if [ -z "$MINOR" ]; then MINOR=0; fi
          if [ -z "$PATCH" ]; then PATCH=0; fi

          if [ $((FEAT + FIX + BREAKING)) -eq 0 ]; then
            NEW_VERSION="$VERSION"
            NEW_CODE="$CODE"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            if [ $BREAKING -gt 0 ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            else
              MINOR=$((MINOR + FEAT))
              PATCH=$((PATCH + FIX))
            fi
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            NEW_CODE=$((CODE + 1))
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

          echo "new_name=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

  update_version:
    name: Update Version
    needs: version_manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: develop

      - name: Update build.gradle(.kts) if version updated
        if: ${{ needs.version_manager.outputs.updated == 'true' }}
        run: |
          FILE_KTS="${GITHUB_WORKSPACE}/app/build.gradle.kts"
          FILE_GRADLE="${GITHUB_WORKSPACE}/app/build.gradle"
          UPDATED=false

          if [ -f "$FILE_KTS" ]; then
            FILE="$FILE_KTS"
          elif [ -f "$FILE_GRADLE" ]; then
            FILE="$FILE_GRADLE"
          else
            echo "⚠️ Nenhum build.gradle(.kts) encontrado! Versão não será atualizada."
            exit 0
          fi

          echo "Atualizando $FILE..."
          if [[ "$FILE" == *.kts ]]; then
            sed -i "s/versionCode .*/versionCode(${{
              needs.version_manager.outputs.new_code
            }})/" "$FILE"
            sed -i "s/versionName \".*\"/versionName(\"${{ needs.version_manager.outputs.new_name }}\")/" "$FILE"
          else
            sed -i "s/versionCode .*/versionCode ${{ needs.version_manager.outputs.new_code }}/" "$FILE"
            sed -i "s/versionName \".*\"/versionName \"${{ needs.version_manager.outputs.new_name }}\"/" "$FILE"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.TOKEN }}@github.com/${{ github.repository }}.git
          git add "$FILE"
          git commit -m "chore: bump version to ${{ needs.version_manager.outputs.new_name }} (${{ needs.version_manager.outputs.new_code }})" || echo "Nenhuma alteração para commitar"
          git push origin develop

  pr_release_create:
    name: PR Release Create
    needs: update_version
    if: ${{ needs.version_manager.outputs.updated == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: develop

      - name: Set release branch name
        run: echo "RELEASE_BRANCH=release-$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create release branch and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b $RELEASE_BRANCH
          git push origin $RELEASE_BRANCH

      - name: Create Pull Request via GH CLI
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          gh auth login --with-token <<< "$GITHUB_TOKEN"
          gh pr create \
            --title "Release ${{ needs.version_manager.outputs.new_name }}" \
            --body "$(echo "${{ needs.version_manager.outputs.new_name }}:
              - Feats: ${{ needs.version_manager.outputs.feat }}
              - Fix/Refactor/Perf/Revert: ${{ needs.version_manager.outputs.fix }}
              - Breaking Changes: ${{ needs.version_manager.outputs.breaking }}")" \
            --base master \
            --head $RELEASE_BRANCH
