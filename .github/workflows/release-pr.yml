name: Release to Master

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout develop
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: develop

      # 2️⃣ Trazer a master para comparação
      - name: Trazer master
        run: git fetch origin master:master

      # 3️⃣ Configurar Git
      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 4️⃣ Obter versão atual
      - name: Obter versão atual do build.gradle
        id: version
        run: |
          FILE=app/build.gradle
          VERSION_NAME=$(grep "versionName" $FILE | sed 's/.*"\(.*\)"/\1/')
          VERSION_CODE=$(grep "versionCode" $FILE | awk '{print $3}')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      # 5️⃣ Contar commits por tipo
      - name: Contar commits relevantes
        id: count
        run: |
          git fetch origin master:master
          git fetch origin develop:develop

          # Commits do tipo feat
          FEAT=$(git log master..develop --pretty=%s 2>/dev/null | grep -E '^feat' | wc -l)
          FEAT=${FEAT// /}

          # Commits do tipo fix, refactor, revert ou perf
          FIX=$(git log master..develop --pretty=%s 2>/dev/null | grep -E '^(fix|revert|perf|refactor)' | wc -l)
          FIX=${FIX// /}

          # Commits com BREAKING CHANGE
          BREAKING=$(git log master..develop --pretty=%b 2>/dev/null | grep -c 'BREAKING CHANGE')
          BREAKING=${BREAKING// /}

          # Garante valores numéricos
          FEAT=${FEAT:-0}
          FIX=${FIX:-0}
          BREAKING=${BREAKING:-0}

          # Exporta para GITHUB_OUTPUT
          echo "feat=$FEAT" >> $GITHUB_OUTPUT
          echo "fix=$FIX" >> $GITHUB_OUTPUT
          echo "breaking=$BREAKING" >> $GITHUB_OUTPUT

      # 6️⃣ Calcular nova versão semântica
      - name: Calcular nova versão
        id: bump
        run: |
          VERSION=${{ steps.version.outputs.name }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ ${{ steps.count.outputs.breaking }} -gt 0 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          else
            MINOR=$((MINOR + ${{ steps.count.outputs.feat }}))
            PATCH=$((PATCH + ${{ steps.count.outputs.fix }}))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_CODE=$(( ${{ steps.version.outputs.code }} + 1 ))

          echo "new_name=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      # 7️⃣ Atualizar build.gradle com nova versão
      - name: Atualizar build.gradle
        run: |
          FILE=app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ steps.bump.outputs.new_code }}/" $FILE
          sed -i "s/versionName \".*\"/versionName \"${{ steps.bump.outputs.new_name }}\"/" $FILE
          git add $FILE
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_name }} (${{ steps.bump.outputs.new_code }})" || echo "No changes"

      # 8️⃣ Criar branch de release
      - name: Criar branch de release
        run: |
          BRANCH="release-${{ steps.bump.outputs.new_name }}"
          git checkout -b $BRANCH
          git push origin $BRANCH
          echo "branch_name=$BRANCH" >> $GITHUB_ENV

      # 9️⃣ Criar Pull Request para master
      - name: Criar PR develop → master
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.branch_name }}
          base: master
          title: "Release ${{ steps.bump.outputs.new_name }}"
          body: |
            Release gerada automaticamente:
            - Versão anterior: ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }})
            - Nova versão: ${{ steps.bump.outputs.new_name }} (code ${{ steps.bump.outputs.new_code }})
            - Feats: ${{ steps.count.outputs.feat }}
            - Fix/Refactor/Perf/Revert: ${{ steps.count.outputs.fix }}
            - Breaking Changes: ${{ steps.count.outputs.breaking }}
