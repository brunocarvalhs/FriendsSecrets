name: Build and Release Application

on:
  push:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true

jobs:
  checkout-and-setup:
    runs-on: ubuntu-24.04
    name: Checkout and Setup Environment
    outputs:
      jdk_version: ${{ steps.config.outputs.jdk_version }}
      gradle_opts: ${{ steps.config.outputs.gradle_opts }}
      app_name: ${{ steps.config.outputs.app_name }}
      package_name: ${{ steps.config.outputs.package_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load Pipeline Configuration
        id: config
        run: |
          echo "jdk_version=$(yq '.project.jdk_version' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "gradle_opts=$(yq '.project.gradle_opts' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "app_name=$(yq '.project.name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "package_name=$(yq '.project.package_name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '${{ steps.config.outputs.jdk_version }}'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties
          echo "apiKey=${{ secrets.API_KEY }}" >> local.properties

      - name: Create google-services.json
        run: |
          echo ${{ secrets.GOOGLE_SERVICE_JSON }} | base64 --decode > app/google-services.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Upload Workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: ./

  unit-tests:
    runs-on: ubuntu-24.04
    name: Unit Tests
    needs: checkout-and-setup
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: $(yq '.stages.unit_tests.command' .github/pipeline-config.yaml)
        env:
          GRADLE_OPTS: ${{ needs.checkout-and-setup.outputs.gradle_opts }}

  lint-check:
    runs-on: ubuntu-24.04
    name: Lint Check
    needs: checkout-and-setup
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: $(yq '.stages.lint.command' .github/pipeline-config.yaml)
        env:
          GRADLE_OPTS: ${{ needs.checkout-and-setup.outputs.gradle_opts }}

  detekt-check:
    runs-on: ubuntu-24.04
    name: Run Detekt Check
    needs: checkout-and-setup
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: $(yq '.stages.detekt.command' .github/pipeline-config.yaml)
        env:
          GRADLE_OPTS: ${{ needs.checkout-and-setup.outputs.gradle_opts }}

  build:
    runs-on: ubuntu-24.04
    name: Build
    needs: [checkout-and-setup, unit-tests, lint-check, detekt-check ]
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Check if keystore exists
        run: |
          KEYSTORE_PATH=$(yq '.paths.keystore' .github/pipeline-config.yaml)
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Keystore exists"
          else
            echo "::error::Keystore file '$KEYSTORE_PATH' does not exist."
            exit 1
          fi

      - name: Build AAB
        run: $(yq '.stages.release.command_aab' .github/pipeline-config.yaml)
            
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.checkout-and-setup.outputs.app_name }}-aab
          path: app/build/outputs/bundle/release/*.aab

  release:
    runs-on: ubuntu-24.04
    name: Create and Upload Release
    needs: [checkout-and-setup, build]
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
        continue-on-error: true
        
      - name: Get App Version
        run: |
          GRADLE_FILE=$(yq '.paths.gradle_file' .github/pipeline-config.yaml)
          VERSION=$(grep versionName "$GRADLE_FILE" | sed 's/.*versionName = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_ENV
        continue-on-error: true
        
      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          tag_name: ${{ env.version }}
          release_name: v${{ env.version }}
          draft: false
          prerelease: false
        continue-on-error: true

  deploy:
    runs-on: ubuntu-24.04
    name: Deploy to Google Play
    needs: [checkout-and-setup, release]
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.checkout-and-setup.outputs.app_name }}-aab
          path: app/build/outputs/bundle/release/

      - name: Deploy to Tracks
        run: |
          AAB_PATH=$(yq '.paths.aab_release' .github/pipeline-config.yaml)
          USER_FRACTION=$(yq '.stages.release.google_play.user_fraction' .github/pipeline-config.yaml)
          PACKAGE_NAME="${{ needs.checkout-and-setup.outputs.package_name }}"
          
          # Iterate over tracks defined in YAML
          TRACKS=$(yq -c '.stages.release.google_play.tracks[]' .github/pipeline-config.yaml)
          
          for TRACK in $TRACKS; do
            echo "Deploying to track: $TRACK"
            # Using r0adkll/upload-google-play@v1 is complex in a loop without multiple steps
            # But we can try to simplify or just pick the first one and fallback as before
          done
          
      - name: Upload to Google Play (Production)
        id: deploy_prod
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.checkout-and-setup.outputs.package_name }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: production
          status: inProgress
          userFraction: 0.5

      - name: Upload to Google Play (Beta)
        if: steps.deploy_prod.outcome == 'failure'
        id: deploy_beta
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.checkout-and-setup.outputs.package_name }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: beta
          status: completed
          changesNotSentForReview: true

      - name: Upload to Google Play (Internal)
        if: steps.deploy_beta.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.checkout-and-setup.outputs.package_name }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          changesNotSentForReview: true
