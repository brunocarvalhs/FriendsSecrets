name: Build Application Debug

on:
  push:
    branches: [ develop ]

env:
  # Configurações Gerais
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true
  JDK_VERSION: 17
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m"

  # Android
  BUILD_TOOLS_VERSION: "34.0.0"
  ANDROID_LOCAL_PROPERTIES: local.properties

  # Projeto
  APP_NAME: "FriendsSecrets"

  # Caminhos
  APK_DEBUG_PATH: app/build/outputs/apk/debug/*.apk
  APK_RELEASE_PATH: app/build/outputs/apk/release/*.apk

  # 🔑 Secrets (configurados no repo)
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
  FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
  FIREBASE_APP_ID: "1:212108336384:android:e74d22bacd5f156e2427e5"

  # Variaveis
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  checkout-and-setup:
    runs-on: ubuntu-24.04
    name: Checkout and Setup Environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VERSION }}'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties
          echo "apiKey=${{ env.API_KEY }}" >> local.properties

      - name: Create google-services.json
        run: |
          echo ${{ env.GOOGLE_SERVICE_JSON }} | base64 --decode > app/google-services.json

      - name: Create Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # O uso de printf "%s" evita que o shell interprete caracteres especiais no Base64
          printf "%s" "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          
          # Validação imediata: se o keytool não conseguir ler, o segredo está corrompido
          if ! keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null; then
            echo "::error::A Keystore decodificada está corrompida ou a senha está incorreta."
            echo "::error::Verifique se o segredo RELEASE_KEYSTORE_BASE64 no GitHub não possui espaços ou quebras de linha."
            exit 1
          fi
          echo "✅ Keystore validada com sucesso."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Upload Workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: ./

  unit-tests:
    runs-on: ubuntu-24.04
    name: Run Unit Tests
    needs: checkout-and-setup
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebug
        env:
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}

  lint-check:
    runs-on: ubuntu-24.04
    name: Run Lint Check
    needs: checkout-and-setup
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug
        env:
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}

  detekt-check:
    runs-on: ubuntu-24.04
    name: Run Detekt Check
    needs: checkout-and-setup
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt
        env:
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}

  build:
    runs-on: ubuntu-24.04
    name: Build
    needs: [unit-tests, lint-check, detekt-check]
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Check Keystore Integrity
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f "app/release.keystore" ]; then
            echo "✅ Keystore file found."
            # Verifica se o arquivo não está vazio e se o keytool consegue lê-lo
            if [ ! -s "app/release.keystore" ]; then
                echo "::error::Keystore file is empty!"
                exit 1
            fi
            keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null
            if [ $? -ne 0 ]; then
              echo "::error::Keystore is invalid or password incorrect. (Tag number over 30 error often means corruption during base64 decode)"
              exit 1
            fi
            echo "✅ Keystore integrity verified."
          else
            echo "::error::Keystore file 'app/release.keystore' not found!"
            exit 1
          fi

      - name: Build APKs (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apks
          path: app/build/outputs/apk/

  deploy-firebase:
    runs-on: ubuntu-24.04
    name: Deploy to Firebase App Distribution
    needs: [ build ]

    steps:
      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apks
          path: app/build/outputs/apk/

      - name: Install Firebase CLI
        run: curl -sL https://firebase.tools | bash

      - name: Prepare Release Notes
        run: |
          cat <<EOF > notes.txt
          🚀 Build ${{ github.run_number }}
          📦 Branch: ${{ github.ref_name }}

          📝 Changes:
          ${{ github.event.head_commit.message || 'Automatic deploy' }}
          EOF

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          cat notes.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Upload Debug APK to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/service-account.json

          firebase appdistribution:distribute app/build/outputs/apk/debug/*.apk \
            --app "${{ env.FIREBASE_APP_ID }}" \
            --release-notes "${{ env.RELEASE_NOTES }} (Debug)"

      - name: Upload Release APK to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/service-account.json

          firebase appdistribution:distribute app/build/outputs/apk/release/*.apk \
            --app "${{ env.FIREBASE_APP_ID }}" \
            --release-notes "${{ env.RELEASE_NOTES }} (Release)"
