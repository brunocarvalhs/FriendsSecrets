name: Build Application Debug

on:
  push:
    branches: [ develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true

jobs:
  checkout-and-setup:
    runs-on: ubuntu-24.04
    name: Checkout and Setup Environment
    outputs:
      jdk_version: ${{ steps.config.outputs.jdk_version }}
      gradle_opts: ${{ steps.config.outputs.gradle_opts }}
      app_name: ${{ steps.config.outputs.app_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load Pipeline Configuration
        id: config
        run: |
          echo "jdk_version=$(yq '.project.jdk_version' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "gradle_opts=$(yq '.project.gradle_opts' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT
          echo "app_name=$(yq '.project.name' .github/pipeline-config.yaml)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '${{ steps.config.outputs.jdk_version }}'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties
          echo "apiKey=${{ secrets.API_KEY }}" >> local.properties

      - name: Create google-services.json
        run: |
          echo ${{ secrets.GOOGLE_SERVICE_JSON }} | base64 --decode > app/google-services.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Upload Workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: ./

  unit-tests:
    runs-on: ubuntu-24.04
    name: Run Unit Tests
    needs: checkout-and-setup
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: $(yq '.stages.unit_tests.command' .github/pipeline-config.yaml)
        env:
          GRADLE_OPTS: ${{ needs.checkout-and-setup.outputs.gradle_opts }}

  lint-check:
    runs-on: ubuntu-24.04
    name: Run Lint Check
    needs: checkout-and-setup
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: $(yq '.stages.lint.command' .github/pipeline-config.yaml)
        env:
          GRADLE_OPTS: ${{ needs.checkout-and-setup.outputs.gradle_opts }}

  detekt-check:
    runs-on: ubuntu-24.04
    name: Run Detekt Check
    needs: checkout-and-setup
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: $(yq '.stages.detekt.command' .github/pipeline-config.yaml)
        env:
          GRADLE_OPTS: ${{ needs.checkout-and-setup.outputs.gradle_opts }}

  build:
    runs-on: ubuntu-24.04
    name: Build
    needs: [checkout-and-setup, unit-tests, lint-check, detekt-check]
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Download Workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Give execution permissions to gradlew
        run: chmod +x gradlew

      - name: Check if keystore exists
        run: |
          KEYSTORE_PATH=$(yq '.paths.keystore' .github/pipeline-config.yaml)
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Keystore exists"
          else
            echo "::error::Keystore file '$KEYSTORE_PATH' does not exist."
            exit 1
          fi

      - name: Build APKs (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.checkout-and-setup.outputs.app_name }}-apks
          path: app/build/outputs/apk/

  deploy-firebase:
    runs-on: ubuntu-24.04
    name: Deploy to Firebase App Distribution
    needs: [ checkout-and-setup, build ]

    steps:
      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.checkout-and-setup.outputs.app_name }}-apks
          path: app/build/outputs/apk/

      - name: Install Firebase CLI
        run: curl -sL https://firebase.tools | bash

      - name: Prepare Release Notes
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG="${COMMIT_MSG:-$(yq '.stages.deploy_firebase.release_notes' .github/pipeline-config.yaml)}"
          CLEAN_MSG=$(echo "$MSG" | head -c 500 | tr '"' "'")

          {
            echo "RELEASE_NOTES<<EOF"
            echo "🚀 Build ${{ github.run_number }}"
            echo "📦 Branch: ${{ github.ref_name }}"
            echo ""
            echo "📝 Changes:"
            echo "$CLEAN_MSG"
            echo "EOF"
          } >> $GITHUB_ENV

          ls app/build/outputs/apk/debug/*.apk | tail -n +2 | xargs -r rm -f || true
          ls app/build/outputs/apk/release/*.apk | tail -n +2 | xargs -r rm -f || true

      - name: Upload Debug APK to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/service-account.json
          
          FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}"
          APK_PATH=$(yq '.paths.apk_debug' .github/pipeline-config.yaml)

          firebase appdistribution:distribute $APK_PATH \
            --app "$FIREBASE_APP_ID" \
            --release-notes "${{ env.RELEASE_NOTES }} (Debug)"

      - name: Upload Release APK to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/service-account.json

          FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}"
          APK_PATH=$(yq '.paths.apk_release' .github/pipeline-config.yaml)

          firebase appdistribution:distribute $APK_PATH \
            --app "$FIREBASE_APP_ID" \
            --release-notes "${{ env.RELEASE_NOTES }} (Release)"
